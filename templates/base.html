<!DOCTYPE html>
<html lang="fr">
<head>
    <title>{% block titre %}Mes tâches{% endblock %}</title>
    {% block head %}
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
    {% endblock %}
</head>
<body>
    <nav>
        <ul>
            <li><a href="{{ url_for('index') }}">Accueil</a></li>
            <li><a href="{{ url_for('index') }}">Tâches</a></li>
            <li><a href="{{ url_for('ajouter') }}">Ajouter</a></li>
        </ul>
    </nav>
    <div id="content">{% block content %}je sais pas quoi ecrire{% endblock %}</div>
    
    {% with messages = get_flashed_messages() %}
        {% if messages %}
            <ul>
                {% for message in messages %}
                <li>{{ message }}</li>
                {% endfor %}
            </ul>
        {% endif %}
    {% endwith %}
</body>
</html>
